allowBuilds:
  # esbuild 的可执行文件由平台包 @esbuild/darwin-arm64 直接提供，
  # 不需要跑它的 postinstall 脚本；显式置 false 避免 pnpm 的 ignored-builds 报错。
  esbuild: false
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.42'
  - '@ai-sdk/mcp@2.0.26'
  - '@ai-sdk/provider-utils@5.0.22'
  - '@ai-sdk/react@4.0.57'
  - ai@7.0.54
